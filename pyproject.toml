[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-gen-ui"
version = "0.2.0"
description = "Web UI for song generation with YuE2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# The real model backend. Install torch for your platform first (see README).
yue2 = ["yue2-infer @ git+https://github.com/multimodal-art-projection/YuE@yue2-v0.1.6", "gguf>=0.17"]
# Faster vLLM backend (Linux/NVIDIA only).
fast = ["yue2-infer[fast] @ git+https://github.com/multimodal-art-projection/YuE@yue2-v0.1.6"]
# Optional Lua plugin runtime.
lua = ["lupa>=2.0"]
# LoRA training (MERT features, resampling). torchaudio is installed by install.sh from the torch index.
train = ["scipy>=1.11", "soundfile>=0.12"]
dev = ["pytest>=8", "httpx>=0.27", "lupa>=2.0", "gguf>=0.17", "scipy>=1.11"]

[project.scripts]
music-gen-ui = "musicgen_ui.__main__:main"
music-gen-ui-download = "musicgen_ui.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicgen_ui = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
